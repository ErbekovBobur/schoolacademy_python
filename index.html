<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PYTHON QUEST</title>
    <link rel="icon" href="ico.png" type="image/x-icon">
    <style>
        :root {
            --bg1: #0b0f19;
            --bg2: #1a1d2e;
            --cyan: #00f2fe;
            --purple: #7928ca;
            --green: #00dfa2;
            --pink: #ff007a;
            --amber: #ffb000;
            --text: #e7ecff;
            --glass: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: radial-gradient(circle at 20% 10%,
                    var(--bg2),
                    var(--bg1) 60%);
            color: var(--text);
            font-family: "Segoe UI", system-ui, sans-serif;
            min-height: 100%;
            overflow-x: hidden;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        #bggrid {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(0, 242, 254, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridmove 20s linear infinite;
        }

        @keyframes gridmove {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 40px 40px;
            }
        }

        .particle {
            position: fixed;
            border-radius: 50%;
            background: var(--cyan);
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-30px);
            }
        }

        #app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
        }

        h1,
        h2,
        h3 {
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .glow {
            text-shadow: 0 0 12px currentColor;
        }

        .card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            backdrop-filter: blur(8px);
        }

        .btn {
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            color: #0b0f19;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
            transition:
                transform 0.12s,
                box-shadow 0.12s;
            box-shadow: 0 0 14px rgba(0, 242, 254, 0.35);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 22px rgba(0, 242, 254, 0.6);
        }

        .btn:active {
            transform: translateY(0) scale(0.97);
        }

        .btn.secondary {
            background: var(--glass);
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: none;
        }

        .btn.small {
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 8px;
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        input[type="text"] {
            background: #0d1120;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 15px;
            width: 220px;
        }

        .bar {
            height: 12px;
            border-radius: 6px;
            background: #0d1120;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .bar>div {
            height: 100%;
            background: linear-gradient(90deg, var(--green), var(--cyan));
        }

        .screen {
            animation: fadein 0.35s ease;
        }

        @keyframes fadein {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .avatarpick {
            font-size: 34px;
            padding: 10px 14px;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            background: var(--glass);
        }

        .avatarpick.sel {
            border-color: var(--cyan);
            box-shadow: 0 0 14px var(--cyan);
        }

        #map-nodes {
            position: relative;
            padding: 24px 0;
        }

        .node {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin: 10px 14px;
            cursor: pointer;
            text-align: center;
            width: 96px;
        }

        .node .dot {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 2px solid var(--border);
            background: var(--glass);
        }

        .node.avail .dot {
            border-color: var(--cyan);
            box-shadow: 0 0 18px var(--cyan);
            animation: pulse 1.6s infinite;
        }

        .node.done .dot {
            border-color: var(--amber);
            box-shadow: 0 0 12px var(--amber);
        }

        .node.locked {
            cursor: default;
        }

        .node.locked .dot {
            opacity: 0.35;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 10px var(--cyan);
            }

            50% {
                box-shadow: 0 0 26px var(--cyan);
            }
        }

        .zone {
            margin-bottom: 18px;
        }

        .topicbar {
            height: 8px;
            border-radius: 5px;
            background: #0d1120;
            overflow: hidden;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 280px;
        }

        .topicbar>div {
            height: 100%;
            background: linear-gradient(90deg, var(--purple), var(--pink));
        }

        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 820px) {
            .split {
                grid-template-columns: 1fr;
            }
        }

        textarea {
            width: 100%;
            min-height: 170px;
            background: #0a0d16;
            color: #c9f7ff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 14.5px;
            line-height: 1.5;
            resize: vertical;
            white-space: pre;
        }

        .gameworld {
            position: relative;
            background: radial-gradient(circle at 60% 20%, #141a2e, #0b0f19);
            border-radius: 16px;
            border: 1px solid var(--border);
            min-height: 340px;
            overflow: hidden;
            padding: 16px;
        }

        .robot {
            font-size: 60px;
            transition: transform 0.4s;
        }

        .robot.hurt {
            animation: shake 0.3s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        .terminal {
            position: absolute;
            right: 20px;
            bottom: 20px;
            font-size: 34px;
            opacity: 0.5;
            transition: 0.4s;
        }

        .terminal.on {
            opacity: 1;
            filter: drop-shadow(0 0 12px var(--green));
        }

        .hud {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .msgbox {
            background: var(--glass);
            border-left: 3px solid var(--cyan);
            padding: 10px 12px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 14px;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(4, 6, 14, 0.85);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .stars {
            font-size: 34px;
            letter-spacing: 6px;
        }

        .token {
            background: var(--glass);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12.5px;
        }

        .token:hover {
            background: rgba(0, 242, 254, 0.15);
        }

        .pill {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 13px;
        }

        .errbox {
            border-left-color: var(--pink) !important;
        }

        .okbox {
            border-left-color: var(--green) !important;
        }

        .chip {
            display: inline-block;
            background: rgba(0, 223, 162, 0.12);
            border: 1px solid var(--green);
            color: var(--green);
            border-radius: 8px;
            padding: 3px 8px;
            margin: 2px;
            font-size: 12px;
        }

        .statusline {
            margin-top: 8px;
            font-weight: 700;
            font-size: 15px;
        }

        .diffbadge {
            font-size: 12px;
        }

        .hidden {
            display: none !important;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--purple);
            border-radius: 8px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

        let actx = null;
        function beep(freq, dur, type = "sine") {
            if (!S.soundOn) return;
            try {
                actx =
                    actx || new (window.AudioContext || window.webkitAudioContext)();
                const o = actx.createOscillator(),
                    g = actx.createGain();
                o.type = type;
                o.frequency.value = freq;
                o.connect(g);
                g.connect(actx.destination);
                g.gain.setValueAtTime(0.08, actx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
                o.start();
                o.stop(actx.currentTime + dur);
            } catch (e) { }
        }

        /* ===== PYTHON-LIKE INTERPRETER (safe, no eval) ===== */
        function tokenizeExpr(s) {
            return (
                s.match(
                    /"[^"]*"|'[^']*'|\d+\.\d+|\d+|[A-Za-z_]\w*|[+\-*/,\[\]()]/g,
                ) || []
            );
        }
        class ExprParser {
            constructor(tokens, vars, simInput) {
                this.t = tokens;
                this.i = 0;
                this.vars = vars;
                this.simInput = simInput;
            }
            peek() {
                return this.t[this.i];
            }
            next() {
                return this.t[this.i++];
            }
            parseExpr() {
                let v = this.parseTerm();
                while (this.peek() === "+" || this.peek() === "-") {
                    const op = this.next();
                    const r = this.parseTerm();
                    v =
                        op === "+"
                            ? typeof v === "string" || typeof r === "string"
                                ? String(v) + String(r)
                                : v + r
                            : v - r;
                }
                return v;
            }
            parseTerm() {
                let v = this.parseFactor();
                while (this.peek() === "*" || this.peek() === "/") {
                    const op = this.next();
                    const r = this.parseFactor();
                    v = op === "*" ? v * r : v / r;
                }
                return v;
            }
            parseFactor() {
                const t = this.next();
                if (t === undefined) throw { msg: "Неожиданный конец выражения" };
                if (/^".*"$/.test(t) || /^'.*'$/.test(t)) return t.slice(1, -1);
                if (/^\d+\.\d+$/.test(t)) return parseFloat(t);
                if (/^\d+$/.test(t)) return parseInt(t);
                if (t === "[") {
                    const arr = [];
                    if (this.peek() !== "]") {
                        arr.push(this.parseExpr());
                        while (this.peek() === ",") {
                            this.next();
                            arr.push(this.parseExpr());
                        }
                    }
                    this.next();
                    return arr;
                }
                if (t === "(") {
                    const v = this.parseExpr();
                    this.next();
                    return v;
                }
                if (/^[A-Za-z_]\w*$/.test(t)) {
                    if (t === "len" && this.peek() === "(") {
                        this.next();
                        const v = this.parseExpr();
                        this.next();
                        if (!Array.isArray(v) && typeof v !== "string")
                            throw { msg: "len() применим к списку или строке" };
                        return v.length;
                    }
                    if (t === "int" && this.peek() === "(") {
                        this.next();
                        const v = this.parseExpr();
                        this.next();
                        return parseInt(v);
                    }
                    if (t === "float" && this.peek() === "(") {
                        this.next();
                        const v = this.parseExpr();
                        this.next();
                        return parseFloat(v);
                    }
                    if (t === "str" && this.peek() === "(") {
                        this.next();
                        const v = this.parseExpr();
                        this.next();
                        return String(v);
                    }
                    if (t === "input" && this.peek() === "(") {
                        this.next();
                        this.next();
                        return this.simInput !== undefined ? this.simInput : "";
                    }
                    if (!Object.prototype.hasOwnProperty.call(this.vars, t))
                        throw { msg: 'Переменная "' + t + '" ещё не определена' };
                    let val = this.vars[t];
                    if (this.peek() === "[") {
                        this.next();
                        const idx = this.parseExpr();
                        this.next();
                        if (!Array.isArray(val) && typeof val !== "string")
                            throw { msg: '"' + t + '" не является списком' };
                        val = val[idx];
                    }
                    return val;
                }
                throw { msg: "Не удалось распознать: " + t };
            }
        }
        function evalExpr(s, vars, simInput) {
            return new ExprParser(tokenizeExpr(s), vars, simInput).parseExpr();
        }
        function evalCond(expr, vars, simInput) {
            expr = expr.trim();
            let p = splitTopLevel(expr, " or ");
            if (p.length > 1) return p.some((x) => evalCond(x, vars, simInput));
            p = splitTopLevel(expr, " and ");
            if (p.length > 1) return p.every((x) => evalCond(x, vars, simInput));
            if (/^not\s+/.test(expr))
                return !evalCond(expr.replace(/^not\s+/, ""), vars, simInput);
            const m = expr.match(/^(.+?)(==|!=|>=|<=|>|<)(.+)$/);
            if (m) {
                const a = evalExpr(m[1], vars, simInput),
                    b = evalExpr(m[3], vars, simInput),
                    op = m[2];
                if (op === "==") return a == b;
                if (op === "!=") return a != b;
                if (op === ">") return a > b;
                if (op === "<") return a < b;
                if (op === ">=") return a >= b;
                return a <= b;
            }
            const v = evalExpr(expr, vars, simInput);
            return !!v && v !== "" && v !== 0;
        }
        function splitTopLevel(s, sep) {
            let depth = 0,
                parts = [],
                cur = "";
            for (let i = 0; i < s.length; i++) {
                if (s[i] === "[" || s[i] === "(") depth++;
                if (s[i] === "]" || s[i] === ")") depth--;
                if (depth === 0 && s.slice(i, i + sep.length) === sep) {
                    parts.push(cur);
                    cur = "";
                    i += sep.length - 1;
                    continue;
                }
                cur += s[i];
            }
            parts.push(cur);
            return parts;
        }
        function getIndent(l) {
            return l.match(/^[ \t]*/)[0].replace(/\t/g, "    ").length;
        }
        function blockEnd(lines, headerIdx, end, baseIndent) {
            let j = headerIdx + 1;
            while (j < end && lines[j].indent > baseIndent) j++;
            return j;
        }
        function execBlock(lines, start, end, vars, output, events, simInput) {
            let i = start;
            if (i >= end) return i;
            const baseIndent = lines[start].indent;
            while (i < end) {
                const ln = lines[i];
                if (ln.indent !== baseIndent) {
                    i++;
                    continue;
                }
                const text = ln.text;
                try {
                    let m;
                    if ((m = text.match(/^print\((.*)\)$/))) {
                        const val = evalExpr(m[1], vars, simInput);
                        output.push(
                            Array.isArray(val) ? "[" + val.join(", ") + "]" : String(val),
                        );
                        events.push({ type: "print", value: val });
                        i++;
                    } else if (/^if\s+.+:$/.test(text)) {
                        i = execIfChain(
                            lines,
                            i,
                            end,
                            baseIndent,
                            vars,
                            output,
                            events,
                            simInput,
                        );
                    } else if ((m = text.match(/^while\s+(.+):$/))) {
                        const bEnd = blockEnd(lines, i, end, baseIndent);
                        let guard = 0;
                        while (evalCond(m[1], vars, simInput) && guard < 1000) {
                            execBlock(lines, i + 1, bEnd, vars, output, events, simInput);
                            guard++;
                        }
                        if (guard >= 1000)
                            throw { msg: "Похоже на бесконечный цикл (while)" };
                        i = bEnd;
                    } else if (
                        (m = text.match(/^for\s+(\w+)\s+in\s+range\((.+)\):$/))
                    ) {
                        const args = m[2]
                            .split(",")
                            .map((s) => evalExpr(s.trim(), vars, simInput));
                        let st = 0,
                            stop,
                            step = 1;
                        if (args.length === 1) {
                            stop = args[0];
                        } else if (args.length === 2) {
                            st = args[0];
                            stop = args[1];
                        } else {
                            st = args[0];
                            stop = args[1];
                            step = args[2];
                        }
                        const bEnd = blockEnd(lines, i, end, baseIndent);
                        let guard = 0;
                        for (let v = st; step > 0 ? v < stop : v > stop; v += step) {
                            vars[m[1]] = v;
                            execBlock(lines, i + 1, bEnd, vars, output, events, simInput);
                            guard++;
                            if (guard > 2000) throw { msg: "Слишком много итераций (for)" };
                        }
                        i = bEnd;
                    } else if ((m = text.match(/^(\w+)\.append\((.+)\)$/))) {
                        if (!Array.isArray(vars[m[1]]))
                            throw { msg: '"' + m[1] + '" не является списком' };
                        vars[m[1]].push(evalExpr(m[2], vars, simInput));
                        events.push({ type: "append", name: m[1] });
                        i++;
                    } else if ((m = text.match(/^(\w+)\.remove\((.+)\)$/))) {
                        if (!Array.isArray(vars[m[1]]))
                            throw { msg: '"' + m[1] + '" не является списком' };
                        const val = evalExpr(m[2], vars, simInput);
                        const idx = vars[m[1]].indexOf(val);
                        if (idx === -1)
                            throw { msg: 'Значение не найдено в списке "' + m[1] + '"' };
                        vars[m[1]].splice(idx, 1);
                        events.push({ type: "remove", name: m[1] });
                        i++;
                    } else if ((m = text.match(/^(\w+)\[(.+)\]\s*=\s*(.+)$/))) {
                        if (!Array.isArray(vars[m[1]]))
                            throw { msg: '"' + m[1] + '" не является списком' };
                        const idx = evalExpr(m[2], vars, simInput);
                        vars[m[1]][idx] = evalExpr(m[3], vars, simInput);
                        events.push({ type: "assign", name: m[1] });
                        i++;
                    } else if ((m = text.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/))) {
                        const val = evalExpr(m[2], vars, simInput);
                        vars[m[1]] = val;
                        events.push({ type: "assign", name: m[1], value: val });
                        i++;
                    } else {
                        throw { msg: "Команда не распознана: " + text };
                    }
                } catch (e) {
                    throw { msg: e.msg || "Ошибка выполнения", line: i + 1 };
                }
            }
            return i;
        }
        function execIfChain(
            lines,
            i,
            end,
            baseIndent,
            vars,
            output,
            events,
            simInput,
        ) {
            let condMet = false,
                idx = i;
            while (idx < end) {
                const ln = lines[idx];
                if (ln.indent !== baseIndent) break;
                let m;
                if (
                    (m = ln.text.match(/^if\s+(.+):$/)) ||
                    (m = ln.text.match(/^elif\s+(.+):$/))
                ) {
                    const bEnd = blockEnd(lines, idx, end, baseIndent);
                    if (!condMet && evalCond(m[1], vars, simInput)) {
                        execBlock(lines, idx + 1, bEnd, vars, output, events, simInput);
                        condMet = true;
                    }
                    idx = bEnd;
                    continue;
                } else if (ln.text === "else:") {
                    const bEnd = blockEnd(lines, idx, end, baseIndent);
                    if (!condMet) {
                        execBlock(lines, idx + 1, bEnd, vars, output, events, simInput);
                        condMet = true;
                    }
                    idx = bEnd;
                    break;
                } else break;
            }
            return idx;
        }

            }));
            const vars = {},

                events = [];
            if (lines.length)
                execBlock(lines, 0, lines.length, vars, output, events, simInput);
            return { vars, output, events };
        }

                reward =
                    stars === 3
                        ? lv.reward.xp
                        : stars === 2
                            ? Math.round(lv.reward.xp * 0.75)
                            : Math.round(lv.reward.xp * 0.5);
                coinReward =
                    stars === 3
                        ? lv.reward.coins
                        : stars === 2
                            ? Math.round(lv.reward.coins * 0.75)
                            : Math.round(lv.reward.coins * 0.5);
                S.combo = stars === 3 ? S.combo + 1 : 0;
            } else {
                reward = 0;
                coinReward = Math.round(lv.reward.coins * 0.2); // limited replay reward
            }
            S.xp += reward;
            S.coins += coinReward;
            if (S.coins >= 100) unlockAchv("collector");
            const prevStars = S.completed[lv.id];
            S.completed[lv.id] =
                prevStars !== undefined ? Math.max(prevStars, stars) : stars;
            let topicBonus = null;
            if (moduleComplete(lv.module) && !S.moduleBonus[lv.module]) {
                S.moduleBonus[lv.module] = true;
                const bXp = 300,
                    bCoins = 100;
                S.xp += bXp;
                S.coins += bCoins;
                topicBonus = {
                    xp: bXp,
                    coins: bCoins,
                    name: MODULES.find((m) => m.id === lv.module).name,
                };
                if (lv.module === 1) unlockAchv("apprentice");
                if (MODULES.find((m) => m.id === lv.module + 1))
                    unlockAchv("explorer");
            }
            save();
            showVictory(stars, reward, coinReward, lv, topicBonus);
        }
        function unlockAchv(id) {
            if (S.achievements[id]) return;
            S.achievements[id] = true;
            save();
        }
        function showVictory(stars, xp, coins, lv, topicBonus) {
            const overlay = document.createElement("div");
            overlay.className = "overlay";
            overlay.innerHTML = `<div class="card" style="max-width:440px;text-align:center">
  <h2 class="glow" style="color:var(--green)">✓ MISSION COMPLETE</h2>
  <div class="stars" style="margin:14px 0">${"⭐".repeat(stars)}${"✩".repeat(3 - stars)}</div>
  <p>+${xp} XP &nbsp; +${coins} 💎</p>
  ${S.combo >= 2 ? `<p style="color:var(--amber);margin-top:6px">🔥 COMBO x${S.combo}</p>` : ""}
  ${topicBonus ? `<div class="msgbox okbox" style="margin-top:14px">🎉 TOPIC COMPLETE: ${topicBonus.name}<br>+${topicBonus.xp} XP · +${topicBonus.coins} 💎 бонус</div>` : ""}
  <div class="row center" style="margin-top:20px">
   ${LEVELS.find((l) => l.id === lv.id + 1 && l.module === lv.module)
                    ? `<button class="btn" onclick="nextLevel(${lv.id + 1})">Следующая миссия →</button>`
                    : LEVELS.find((l) => l.module === lv.module + 1)
                        ? `<button class="btn" onclick="nextLevel(${LEVELS.find((l) => l.module === lv.module + 1).id})">Новая зона →</button>`
                        : ""
                }
   <button class="btn secondary" onclick="closeVictory()">Карта мира</button>
  </div>
 </div>`;
            document.body.appendChild(overlay);
        }
        function closeVictory() {
            document.querySelector(".overlay")?.remove();
            curCode = "";
            curVis = {};
            S.screen = "map";
            save();
            render();
        }
        function nextLevel(id) {
            document.querySelector(".overlay")?.remove();
            curCode = "";
            curVis = {};
            S.curLevel = id;
            S.hints = 0;
            S.attempts = 0;
            save();
            render();
        }

        function initParticles() {
            for (let i = 0; i < 14; i++) {
                const p = document.createElement("div");
                p.className = "particle";
                const s = 2 + Math.random() * 3;
                p.style.width = s + "px";
                p.style.height = s + "px";
                p.style.left = Math.random() * 100 + "vw";
                p.style.top = Math.random() * 100 + "vh";
                p.style.animationDelay = Math.random() * 8 + "s";
                p.style.background = [
                    getComputedStyle(document.documentElement).getPropertyValue(
                        "--cyan",
                    ),
                    getComputedStyle(document.documentElement).getPropertyValue(
                        "--purple",
                    ),
                ][i % 2];
                document.body.appendChild(p);
            }
        }
        initParticles();
        render();
    </script>
</body>

</html>
